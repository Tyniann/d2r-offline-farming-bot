# Lokale Konfiguration (von config.example.yaml kopieren).
# Diese Datei wird nicht versioniert.

app:
  name: d2rbot
  log_level: info

runtime:
  poll_interval_ms: 100

process:
  process_name: D2R.exe
  # 0 = unbegrenzt warten; >0 = Timeout bis zum ersten Attach (ms)
  attach_timeout_ms: 30000

memory:
  # Erwartete D2R-Version für den Offset-Stand; leer = Default aus offsets.go
  game_version: "3.2.92777"
  # Leer = eingebautes DefaultOffsetSet(); sonst YAML-Override (z. B. configs/offsets.local.yaml)
  offsets_file: ""

paths:
  config_dir: configs

input:
  # Echte Tastatur-/Mausaktionen sind standardmäßig deaktiviert (explizites Opt-in).
  # Für --input-test muss enabled: true gesetzt sein.
  enabled: false
  pause_hotkey: pause
  stop_hotkey: f12
  key_delay_ms_min: 10
  key_delay_ms_max: 40
  combo_hold_ms: 200

  # Diese Werte müssen zu den Hotkeys im D2R-Optionsmenü passen.
  bindings:
    skills:
      teleport:
        key: f7
        button: right
      town_portal:
        key: f6
        button: right
      bone_spear:
        key: f8
        button: left
    belt:
      # MVP-Belegung für 4.7: Slot 1 = Heiltränke, Slot 2/3 = Manatränke,
      # Slot 4 = Full Rejuvenation Potions. Später soll diese Belegung
      # benutzerkonfigurierbar werden.
      slot_1: ","
      slot_2: "."
      slot_3: "-"
      slot_4: "]"

runs:
  # countess | leer — Validierung nur zur Laufzeit via Registry
  active: ""
  step_timeout_ms: 30000
  countess:
    combat:
      profile: necro_bone_spear
      attack_skill: bone_spear
      attack_interval_ms: 350
      engage_distance_tiles: 22
      reposition_distance_tiles: 32
      kill_confirm_ticks: 3

pathing:
  # Abbruch, wenn weder Position (>= stuck_progress_tiles) noch Area sich ändern
  stuck_timeout_ms: 8000
  stuck_progress_tiles: 3
  # Mindestabstand zwischen Teleport-Casts
  move_interval_ms: 250
  # Ankunftsdistanz (Tiles) für Positions-Ziele
  arrival_distance: 15
  projection:
    # Spieler-zentrierte Isometrie (Koolo-Modell); kalibriert für 1280×720 windowed.
    # Kalibrierung: --pathing-test teleport:TX,TY
    playable_center_x: 0.5
    playable_center_y: 0.52
    tile_width: 19.8
    tile_height: 9.9
  click:
    # Hover-Feedback-Loop: Klick nur nach bestätigtem Hover (UnitID + UnitType)
    max_hover_attempts: 15
    spiral_step: 40          # Grad pro Versuch (Koolo-Spirale)
    anchor_offset_tiles: 2   # Klickpunkt-Versatz für Entrances/Objects
  explore:
    bearing_count: 8
    step_distance_tiles: 25
    # Entity-Klick nur wenn Entity näher als diese Distanz (muss sichtbar sein)
    max_entrance_click_distance: 15
  waypoint:
    # Town waypoint object click distance gate; object must be visible/enumerated.
    max_click_distance: 15
  waypoint_ui:
    # Client-relative Black Marsh waypoint row; default for 1280x720 windowed.
    black_marsh_x: 200
    black_marsh_y: 342
  town_walk:
    # Force Move key in D2R options; default key is E.
    force_move_key: e
    route_file: configs/routes/act1-town-waypoint.yaml
    move_interval_ms: 650
    settle_timeout_ms: 350
    stuck_timeout_ms: 3500
    arrival_distance_tiles: 8
    # Optional override for the built-in Rogue Encampment stash/spawn -> waypoint route.
    act1_waypoint_points: []
