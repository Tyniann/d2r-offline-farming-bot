# Lokale Konfiguration (von config.example.yaml kopieren).
# Diese Datei wird nicht versioniert.

app:
  name: d2rbot
  log_level: info

runtime:
  poll_interval_ms: 100

process:
  process_name: D2R.exe
  # 0 = unbegrenzt warten; >0 = Timeout bis zum ersten Attach (ms)
  attach_timeout_ms: 30000

memory:
  # Erwartete D2R-Version für den Offset-Stand; leer = Default aus offsets.go
  game_version: "3.2.92777"
  # Leer = eingebautes DefaultOffsetSet(); sonst YAML-Override (z. B. configs/offsets.local.yaml)
  offsets_file: ""

telemetry:
  # Eine fail-closed JSONL-Datei pro aktivem Run, relativ zum Arbeitsverzeichnis.
  directory: logs/telemetry

routes:
  # Alle invalidierbaren Farming-Sätze; der aktive Unterordner wird ausschließlich
  # aus session.character und session.difficulty abgeleitet.
  farming_root: routes/farming
  # Unveröffentlichte, immutable Kandidaten liegen strikt außerhalb des Farming-Roots.
  candidate_root: routes/candidates
  # Atomische lokale Lifecycle-Metadaten; *.local.yaml bleibt gitignoriert.
  lifecycle_file: route-lifecycle.local.yaml
  assignments_file: route-assignments.local.yaml
  recovery_file: route-recovery.local.yaml

loot:
  pickup:
    # Hover-confirmed Pickup: nur klicken, wenn Hover.UnitType=item und Hover.UnitID passt.
    max_retries: 3
    max_distance_tiles: 8
    verify_ticks: 3
    verify_timeout_ms: 1500
    monster_abort_distance_tiles: 12
  stash:
    # Ausschließlich für exakt 1280x720; Ursprung und Zellgröße stammen aus der live validierten D2R-UI.
    max_retries: 3
    verify_timeout_ms: 1500
    close_timeout_ms: 1500
    inventory_left: 847
    inventory_top: 369
    inventory_cell_width: 33
    inventory_cell_height: 33
  cow_portal_recipe:
    # Enger Ein-Klick-Vertrag für exakt 1280x720; kein Transmute-Retry.
    cube_open_timeout_ms: 3000
    transfer_timeout_ms: 2000
    result_timeout_ms: 5000
    portal_timeout_ms: 8000
    close_timeout_ms: 3000
    entry_timeout_ms: 15000
    transmute_x: 270
    transmute_y: 411

paths:
  config_dir: configs

input:
  # Echte Tastatur-/Mausaktionen sind standardmäßig deaktiviert (explizites Opt-in).
  # Für --input-test muss enabled: true gesetzt sein.
  enabled: false
  pause_hotkey: pause
  stop_after_run_hotkey: f10
  recording_finish_hotkey: f9
  stop_hotkey: f11
  key_delay_ms_min: 10
  key_delay_ms_max: 40
  combo_hold_ms: 200
  # Skill- und Gürtelbelegungen liegen in OperatorSettings Schema 3
  # (characters.*.profile_bindings), nicht in config.yaml.

runs:
  # countess | cows | lower-kurast | mephisto | nihlathak | summoner | leer — stabile IDs aus der Run Registry.
  active: ""
  step_timeout_ms: 45000
  definitions:
    countess:
    cows:
      route_combat:
        enabled: true
        immediate_radius_tiles: 18
        corridor_width_tiles: 7
        landing_radius_tiles: 10
        attack_distance_tiles: 30
        no_progress_timeout_ms: 12000
        teleport_mana_reserve_percent: 20
        resume_mana_percent: 35
        emergency_mana_percent: 10
        mana_recovery_timeout_ms: 5000
    lower-kurast:
    mephisto:
      # MrBones/Nightmare-Aufnahme aus Gate 10.9; andere Bindungen benötigen eine eigene Route.
    summoner:
      route_combat:
        enabled: true
        immediate_radius_tiles: 18
        corridor_width_tiles: 7
        landing_radius_tiles: 10
        attack_distance_tiles: 30
        no_progress_timeout_ms: 12000
        teleport_mana_reserve_percent: 20
        resume_mana_percent: 35
        emergency_mana_percent: 10
        mana_recovery_timeout_ms: 5000
    nihlathak:

combat_profiles:
  necro_bone_spear:
    character_class: necromancer
    display_name: Knochen-Speer
    setup:
      enabled: true
      default: true
    combat:
      standard_attack: bone_spear
      attack_interval_ms: 350
      engage_distance_tiles: 22
      reposition_distance_tiles: 32
      kill_confirm_ticks: 3
    required_skills:
      - {skill: teleport, display_name: Teleport}
      - {skill: town_portal, display_name: Stadtportal}
      - {skill: bone_spear, display_name: Knochen-Speer}
      - {skill: amplify_damage, display_name: Verstärkter Schaden}
      - {skill: corpse_explosion, display_name: Kadaverexplosion}
      - {skill: bone_armor, display_name: Knochenrüstung}
      - {skill: bone_prison, display_name: Knochengefängnis}
    hooks:
      town_ready:
        - skill: bone_armor
          target: self
          once_per_game: false
          delay_ms: 5000
          settle_ms: 1500
      boss_engage:
        - skill: bone_prison
          target: boss
          once_per_encounter: true
          delay_ms: 250
          settle_ms: 1000
    resources:
      healing:
        use_below_percent: 65
        belt_slots: [1]
        cooldown_ms: 4000
      mana:
        use_below_percent: 35
        belt_slots: [2, 3]
        cooldown_ms: 4000
      rejuvenation:
        use_below_percent: 35
        belt_slots: [4]
        cooldown_ms: 1500
      mercenary:
        # Presence-sensitiv: fehlender Block = enabled true mit Defaults 50/[1]/4000.
        # Explizites enabled:false deaktiviert Combat- und Town-Merc-Aktionen.
        enabled: true
        use_below_percent: 50
        belt_slots: [1]
        cooldown_ms: 4000
      throttle_ms: 1500
      verify_timeout_ms: 1500
    route_maintenance:
      bone_armor:
        enabled: true
        skill: bone_armor
        refresh_interval_ms: 60000
        refresh_after_damage_below_percent: 65
        minimum_recast_interval_ms: 10000
        settle_ms: 750

  paladin_hammerdin:
    character_class: paladin
    display_name: Hammerdin
    setup:
      enabled: true
      default: true
    combat:
      # Blessed Hammer nur aus Nahkampf: auf 1 Tile teleportieren, dann hämmern.
      standard_attack: blessed_hammer
      attack_interval_ms: 300
      engage_distance_tiles: 1
      reposition_distance_tiles: 3
      kill_confirm_ticks: 3
    required_skills:
      - {skill: teleport, display_name: Teleport, slot: right}
      - {skill: town_portal, display_name: Stadtportal, slot: right}
      - {skill: blessed_hammer, display_name: Gesegneter Hammer, slot: left}
      - {skill: concentration, display_name: Konzentration, slot: right}
      - {skill: holy_shield, display_name: Heiliger Schild, slot: right}
    optional_skill_pairs:
      - skills:
          - {skill: battle_command, slot: right}
          - {skill: battle_orders, slot: right}
    requires_mercenary: true
    hooks:
      town_ready: []
      boss_engage: []
    resources:
      healing:
        use_below_percent: 65
        belt_slots: [1]
        cooldown_ms: 4000
      mana:
        use_below_percent: 35
        belt_slots: [2, 3]
        cooldown_ms: 4000
      rejuvenation:
        use_below_percent: 35
        belt_slots: [4]
        cooldown_ms: 1500
      mercenary:
        enabled: true
        use_below_percent: 50
        belt_slots: [1]
        cooldown_ms: 4000
      throttle_ms: 1500
      verify_timeout_ms: 1500

character_setup:
  pickit_defaults:
    countess: [gems, keys, countess-standard]
    mephisto: [gems, mephisto-standard]
    lower-kurast: [gems, lk-superchests]
    summoner: [gems, keys]
    nihlathak: [gems, keys]

town:
  thresholds:
    healing: 2
    mana: 4
    town_portal_scrolls: 5
    identify_scrolls: 3
  hub:
    area: rogue_encampment
    anchors: [spawn, portal_arrival, stash, waypoint, akara, charsi, cain, kashya]
    services:
      potions: akara
      scrolls: akara
      identify: cain
      sell: akara
      repair: charsi
      mercenary_heal: akara
      mercenary_revive: kashya
    routes_directory: routes/town/act1/graph
  egress:
    act2:
      area: lut_gholein
      anchors: [portal_arrival, waypoint]
      routes_directory: routes/town/act2/egress
    act3:
      area: kurast_docks
      anchors: [portal_arrival, waypoint]
      routes_directory: routes/town/act3/egress
    act4:
      area: the_pandemonium_fortress
      anchors: [portal_arrival, waypoint]
      routes_directory: routes/town/act4/egress
    act5:
      area: harrogath
      anchors: [portal_arrival, waypoint]
      routes_directory: routes/town/act5/egress


session:
  # Phase 7.5 stellt zunächst ausschließlich den read-only --session-inspect bereit.
  # Echte Session-Ausführung bleibt bis zur vollständigen Zyklus-Verifikation deaktiviert.
  enabled: false
  run: countess
  # Phase-11 runtime default; order and duplicates are preserved.
  queue: [countess, mephisto]
  character: ""
  difficulty: normal
  max_runs: 3
  max_duration_ms: 7200000
  cooldown_ms: 3000
  max_consecutive_failures: 2
  max_total_restarts: 3
  state_timeout_ms: 30000
  exit_timeout_ms: 30000
  start_timeout_ms: 45000
  retry_classes:
    - hard_stuck
    - route_drift_exceeded
    - route_segment_timeout
    - route_transition_failed
    - route_clear_no_progress
    - route_threat_out_of_range
    - route_mana_recovery_failed
    - route_recovery_unsafe
    - boss_combat_unprojectable
    - cow_combat_no_progress
    - stash_approach_failed

pathing:
  # Abbruch, wenn weder Position (>= stuck_progress_tiles) noch Area sich ändern
  stuck_timeout_ms: 8000
  stuck_progress_tiles: 3
  # Mindestabstand zwischen Teleport-Casts
  move_interval_ms: 250
  # Ankunftsdistanz (Tiles) für Positions-Ziele
  arrival_distance: 15
  projection:
    # Spieler-zentrierte Isometrie (Koolo-Modell); kalibriert für 1280×720 windowed.
    # Kalibrierung: --pathing-test teleport:TX,TY
    playable_center_x: 0.5
    playable_center_y: 0.52
    tile_width: 19.8
    tile_height: 9.9
  click:
    # Hover-Feedback-Loop: Klick nur nach bestätigtem Hover (UnitID + UnitType)
    max_hover_attempts: 15
    spiral_step: 40          # Grad pro Versuch (Koolo-Spirale)
    anchor_offset_tiles: 2   # Klickpunkt-Versatz für Entrances/Objects
  explore:
    bearing_count: 8
    step_distance_tiles: 25
    # Entity-Klick nur wenn Entity näher als diese Distanz (muss sichtbar sein)
    max_entrance_click_distance: 15
  waypoint:
    # Town waypoint object click distance gate; object must be visible/enumerated.
    max_click_distance: 15
  town_portal:
    # Portal must appear after casting and is clicked only after memory-hover confirmation.
    appear_timeout_ms: 2000
    max_click_distance: 15
  town_walk:
    # Force Move key in D2R options; default key is E.
    force_move_key: e
    move_interval_ms: 650
    settle_timeout_ms: 350
    stuck_timeout_ms: 3500
    arrival_distance_tiles: 8
